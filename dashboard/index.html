<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel de Compras</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef0f4; --border: #dfe3ea;
    --text: #1b1f27; --muted: #5b6575; --accent: #3b5bdb; --accent-text: #ffffff;
    --ok: #1b7f4d; --ok-bg: #dff5e8;
    --warn: #8a5a00; --warn-bg: #fff0cc;
    --info: #1f5fbf; --info-bg: #dbe9ff;
    --bad: #a12b2b; --bad-bg: #fde2e2;
    --shadow: 0 1px 2px rgba(20,25,35,.06), 0 4px 16px rgba(20,25,35,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --surface: #1b2029; --surface-2: #232a36; --border: #2c3544;
      --text: #e8ebf1; --muted: #9aa5b8; --accent: #7c93ff; --accent-text: #0e1220;
      --ok: #6fdc9e; --ok-bg: #173826; --warn: #f2c36b; --warn-bg: #3b2e10;
      --info: #8db8ff; --info-bg: #172c4d; --bad: #ff9b9b; --bad-bg: #411d1d;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --surface: #1b2029; --surface-2: #232a36; --border: #2c3544;
    --text: #e8ebf1; --muted: #9aa5b8; --accent: #7c93ff; --accent-text: #0e1220;
    --ok: #6fdc9e; --ok-bg: #173826; --warn: #f2c36b; --warn-bg: #3b2e10;
    --info: #8db8ff; --info-bg: #172c4d; --bad: #ff9b9b; --bad-bg: #411d1d;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; }

  header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0; }
  header.top h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
  .spacer { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted);
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .live[data-state="on"] .dot { background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2s infinite; }
  .live[data-state="off"] .dot { background: var(--bad); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); }
    70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .who { font-size: 13px; color: var(--muted); }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  .btn:hover { background: var(--surface-2); }
  .btn:focus-visible, input:focus-visible, select:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }

  .center { min-height: 60vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 28px; max-width: 460px; }
  .panel h2 { margin: 0 0 8px; font-size: 18px; }
  .panel p { margin: 0 0 18px; color: var(--muted); }
  .panel code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; font-size: 13px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .card .label { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .card .value { font-size: 24px; font-weight: 650; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card.hero { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }

  .chart { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 10px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .chart h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
  .chart svg { width: 100%; height: 150px; display: block; }
  .chart .bar { fill: var(--accent); }
  .chart .bar:hover { filter: brightness(1.15); }
  .chart text { fill: var(--muted); font-size: 11px; }
  .chart .grid { stroke: var(--border); stroke-width: 1; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .filters input[type=search], .filters select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .filters input[type=search] { flex: 1 1 240px; min-width: 0; }
  .count { font-size: 13px; color: var(--muted); margin: 0 2px 8px; font-variant-numeric: tabular-nums; }

  .tablebox { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; min-width: 980px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
  th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; border-radius: 4px; }
  th button .arrow { opacity: .35; font-size: 10px; } th[aria-sort] button .arrow { opacity: 1; color: var(--accent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td .id { font-weight: 650; font-variant-numeric: tabular-nums; }
  td .name { font-weight: 600; } td .user { color: var(--muted); font-size: 13px; }
  td .items { min-width: 170px; max-width: 300px; }
  td .when { white-space: nowrap; font-variant-numeric: tabular-nums; }
  td .when small { display: block; color: var(--muted); }
  .uid { display: inline-flex; align-items: center; gap: 6px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .uid button { all: unset; cursor: pointer; padding: 1px 6px; border: 1px solid var(--border); border-radius: 6px; font-family: system-ui, sans-serif; font-size: 11px; color: var(--muted); }
  .uid button:hover { background: var(--surface-2); color: var(--text); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .b-aguardando_pagamento { background: var(--warn-bg); color: var(--warn); }
  .b-paga { background: var(--info-bg); color: var(--info); }
  .b-entregue { background: var(--ok-bg); color: var(--ok); }
  .b-cancelada { background: var(--bad-bg); color: var(--bad); }
  .empty { padding: 36px 16px; text-align: center; color: var(--muted); }
  tr.novo td { animation: flash 2.4s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--accent) 28%, transparent); } to { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { .live[data-state="on"] .dot, tr.novo td { animation: none; } }

  @media (max-width: 760px) {
    .wrap { padding: 0 12px 40px; }
    table { min-width: 0; }
    thead { display: none; }
    tbody tr { display: block; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: 0; }
    td { display: grid; grid-template-columns: 112px 1fr; gap: 8px; padding: 4px 0; border: 0; }
    td::before { content: attr(data-label); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
    td.num { text-align: left; }
    td .items { min-width: 0; max-width: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>📊 Painel de Compras</h1>
    <span class="live" id="live" data-state="wait"><span class="dot"></span><span id="liveText">Conectando…</span></span>
    <span class="spacer"></span>
    <span class="who" id="who" hidden></span>
    <button class="btn" id="signOut" hidden>Sair</button>
  </header>

  <main id="stateBox" class="center"><div class="panel"><p>Carregando…</p></div></main>

  <section id="app" hidden>
    <div class="cards" id="cards"></div>

    <div class="chart">
      <h2>Faturamento confirmado por dia (últimos 14 dias)</h2>
      <svg id="chart" role="img" aria-label="Gráfico de barras do faturamento confirmado por dia"></svg>
    </div>

    <div class="filters">
      <input type="search" id="q" placeholder="Buscar por nome, usuário, ID do usuário, item ou nº da compra" aria-label="Buscar compras">
      <select id="fStatus" aria-label="Filtrar por status"></select>
      <select id="fPeriodo" aria-label="Filtrar por período">
        <option value="0">Todo o período</option>
        <option value="1">Hoje</option>
        <option value="7">Últimos 7 dias</option>
        <option value="30">Últimos 30 dias</option>
      </select>
      <button class="btn" id="csv">📥 Exportar CSV</button>
    </div>
    <p class="count" id="count"></p>

    <div class="tablebox">
      <table>
        <thead><tr id="headRow"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p style="text-align:center"><button class="btn" id="mais" hidden></button></p>
  </section>
</div>

<script type="module">
const TZ = "America/Sao_Paulo";
const STATUS = {
  aguardando_pagamento: "Aguardando pagamento",
  paga: "Paga — a entregar",
  entregue: "Entregue",
  cancelada: "Cancelada",
};
// Nomes dos itens para pedidos antigos, que só guardaram a chave do item.
const NOMES = {
  escolhidos: "Escolhidos dos Mares", mudanca: "Mudança Pequena", renascimento: "Renascimento",
  manobra: "Manobra de Emergência", aviso: "Aviso de Amigo", cacador: "Caçador de Tesouros", sorte: "Sorte Grande",
  token: "Token de Segunda Chance", aprendiz: "Aprendiz do Mestre", lunariano: "Re-roll de Lunariano",
  rumores: "Rumores!", supertesouro: "Super Tesouro",
};
const COLUNAS = [
  { id: "id", label: "Compra", sort: true, num: false },
  { id: "criado_em", label: "Data", sort: true },
  { id: "nome", label: "Comprador", sort: true },
  { id: "usuario_id", label: "ID do usuário" },
  { id: "itens", label: "Itens" },
  { id: "total", label: "Total", sort: true, num: true },
  { id: "status", label: "Status", sort: true },
  { id: "andamento", label: "Pago · Entregue" },
  { id: "atualizado_por", label: "Responsável" },
];

const $ = (id) => document.getElementById(id);
{ const t = new URLSearchParams(location.search).get("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; }
const brl = (c) => (c / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const fmtData = (iso) => iso ? new Date(iso).toLocaleString("pt-BR", { timeZone: TZ, dateStyle: "short", timeStyle: "short" }) : "";
const fmtCurta = (iso) => new Date(iso).toLocaleString("pt-BR", { timeZone: TZ, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const diaChave = (d) => new Intl.DateTimeFormat("sv-SE", { timeZone: TZ }).format(d); // AAAA-MM-DD
const el = (tag, props = {}, ...filhos) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const f of filhos) n.append(f);
  return n;
};
// Tudo que vem do banco (nicks, usuários...) entra na página só como TEXTO, nunca como HTML.

let pedidos = [];       // lista atual
let primeiraCarga = true;
let novos = new Set();  // ids a destacar
const POR_PAGINA = 100;  // linhas desenhadas por vez (o resumo, a soma e o CSV usam TODAS as compras filtradas)
const estado = { busca: "", status: "", periodo: 0, ordem: "id", dir: -1, limite: POR_PAGINA };

// ---------- telas de estado ----------
function mostrarEstado(titulo, texto, ...acoes) {
  $("app").hidden = true;
  const box = $("stateBox"); box.hidden = false; box.replaceChildren();
  const p = el("div", { class: "panel" }, el("h2", { text: titulo }));
  if (texto) p.append(el("p", { text: texto }));
  for (const a of acoes) p.append(a);
  box.append(p);
}
function setLive(state, texto) { $("live").dataset.state = state; $("liveText").textContent = texto; }
function mostrarApp() { $("stateBox").hidden = true; $("app").hidden = false; }

// ---------- dados derivados ----------
function normaliza(id, d) {
  const itens = Array.isArray(d.itens_detalhe) && d.itens_detalhe.length
    ? d.itens_detalhe.map((i) => ({ nome: i.nome, qtd: i.qtd }))
    : Object.entries(d.itens || {}).map(([k, q]) => ({ nome: NOMES[k] || k, qtd: q }));
  return {
    id: Number(d.id ?? id), nome: d.nome || d.usuario || "", usuario: d.usuario || "", usuario_id: String(d.usuario_id ?? ""),
    itens, total: Number(d.total_centavos || 0), status: d.status || "aguardando_pagamento",
    criado_em: d.criado_em || "", pago_em: d.pago_em || "", entregue_em: d.entregue_em || "",
    fechado_em: d.fechado_em || "", atualizado_por: d.atualizado_por || "",
  };
}
const itensTexto = (p) => p.itens.map((i) => `${i.qtd}x ${i.nome}`).join(", ");

function resumo(lista) {
  const r = Object.fromEntries(Object.keys(STATUS).map((s) => [s, { n: 0, v: 0 }]));
  for (const p of lista) { const x = r[p.status] || (r[p.status] = { n: 0, v: 0 }); x.n++; x.v += p.total; }
  return r;
}

function renderCards() {
  const r = resumo(pedidos);
  const confirmado = (r.paga?.v || 0) + (r.entregue?.v || 0);
  const defs = [
    ["💵 Faturamento confirmado", brl(confirmado), `${(r.paga?.n || 0) + (r.entregue?.n || 0)} compra(s) paga(s)`, "hero"],
    ["🧾 Compras", String(pedidos.length), "no total"],
    ["🟡 Aguardando pagamento", String(r.aguardando_pagamento.n), brl(r.aguardando_pagamento.v)],
    ["💰 Pagas, a entregar", String(r.paga.n), brl(r.paga.v)],
    ["📦 Entregues", String(r.entregue.n), brl(r.entregue.v)],
    ["❌ Canceladas", String(r.cancelada.n), brl(r.cancelada.v)],
  ];
  $("cards").replaceChildren(...defs.map(([l, v, s, c]) =>
    el("div", { class: "card" + (c ? " " + c : "") }, el("div", { class: "label", text: l }), el("div", { class: "value", text: v }), el("div", { class: "sub", text: s }))));
}

function renderChart() {
  const NS = "http://www.w3.org/2000/svg", DIAS = 14;
  const hoje = new Date(); const dias = [];
  for (let i = DIAS - 1; i >= 0; i--) dias.push(diaChave(new Date(hoje.getTime() - i * 864e5)));
  const soma = Object.fromEntries(dias.map((d) => [d, 0]));
  for (const p of pedidos) {
    if (p.status !== "paga" && p.status !== "entregue") continue;
    const k = p.pago_em ? diaChave(new Date(p.pago_em)) : null;
    if (k in soma) soma[k] += p.total;
  }
  const max = Math.max(...Object.values(soma), 1);
  const svg = $("chart"); svg.replaceChildren();
  const W = Math.max(320, Math.round(svg.getBoundingClientRect().width) || 700), H = 150, base = 124, topo = 14, bw = W / DIAS;
  const passo = bw < 40 ? 2 : 1;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const linha = document.createElementNS(NS, "line");
  for (const [k, v] of Object.entries({ class: "grid", x1: 0, x2: W, y1: base, y2: base })) linha.setAttribute(k, v);
  svg.append(linha);
  dias.forEach((d, i) => {
    const v = soma[d], h = v ? Math.max(3, (v / max) * (base - topo)) : 0;
    const g = document.createElementNS(NS, "g");
    const t = document.createElementNS(NS, "title"); t.textContent = `${d.split("-").reverse().join("/")}: ${brl(v)}`; g.append(t);
    const r = document.createElementNS(NS, "rect");
    for (const [k, val] of Object.entries({ class: "bar", x: i * bw + 6, y: base - h, width: bw - 12, height: h, rx: 3 })) r.setAttribute(k, val);
    g.append(r);
    if ((DIAS - 1 - i) % passo === 0) {  // com pouco espaço, mostra um rótulo sim, outro não
      const tx = document.createElementNS(NS, "text");
      for (const [k, val] of Object.entries({ x: Math.min(Math.max(i * bw + bw / 2, 16), W - 16), y: 142, "text-anchor": "middle" })) tx.setAttribute(k, val);
      tx.textContent = d.slice(8) + "/" + d.slice(5, 7); g.append(tx);
    }
    if (v) {
      const vt = document.createElementNS(NS, "text");
      for (const [k, val] of Object.entries({ x: i * bw + bw / 2, y: base - h - 4, "text-anchor": "middle" })) vt.setAttribute(k, val);
      vt.textContent = (v / 100).toLocaleString("pt-BR", { maximumFractionDigits: 0 }); g.append(vt);
    }
    svg.append(g);
  });
}

// ---------- tabela ----------
function filtrados() {
  const q = estado.busca.trim().toLowerCase().replace(/^#/, "");
  const limite = estado.periodo ? Date.now() - (estado.periodo === 1 ? 0 : estado.periodo) * 864e5 : 0;
  const inicioHoje = (() => { const d = new Date(); return new Date(diaChave(d) + "T00:00:00-03:00").getTime(); })();
  let lista = pedidos.filter((p) => {
    if (estado.status && p.status !== estado.status) return false;
    if (estado.periodo) {
      const t = new Date(p.criado_em).getTime();
      if (estado.periodo === 1 ? t < inicioHoje : t < limite) return false;
    }
    if (q) {
      const alvo = `${String(p.id).padStart(2, "0")} ${p.nome} ${p.usuario} ${p.usuario_id} ${itensTexto(p)}`.toLowerCase();
      if (!alvo.includes(q)) return false;
    }
    return true;
  });
  const chave = estado.ordem === "total" ? (p) => p.total : estado.ordem === "criado_em" ? (p) => p.criado_em
    : estado.ordem === "status" ? (p) => p.status : estado.ordem === "nome" ? (p) => p.nome.toLowerCase() : (p) => p.id;
  lista.sort((a, b) => (chave(a) > chave(b) ? 1 : chave(a) < chave(b) ? -1 : 0) * estado.dir);
  return lista;
}

function renderHead() {
  const tr = $("headRow"); tr.replaceChildren();
  for (const c of COLUNAS) {
    const th = el("th", c.num ? { class: "num" } : {});
    if (c.sort) {
      const ativo = estado.ordem === c.id;
      if (ativo) th.setAttribute("aria-sort", estado.dir > 0 ? "ascending" : "descending");
      const b = el("button", { type: "button" }, c.label, el("span", { class: "arrow", text: ativo ? (estado.dir > 0 ? "▲" : "▼") : "↕" }));
      b.addEventListener("click", () => { if (estado.ordem === c.id) estado.dir *= -1; else { estado.ordem = c.id; estado.dir = c.id === "nome" || c.id === "status" ? 1 : -1; } estado.limite = POR_PAGINA; renderHead(); renderRows(); });
      th.append(b);
    } else th.textContent = c.label;
    tr.append(th);
  }
}

function td(label, conteudo, cls) {
  const c = el("td", { "data-label": label }); if (cls) c.className = cls;
  c.append(conteudo); return c;
}
function quando(iso) {
  if (!iso) return el("span", { text: "—" });
  const [d, h] = fmtData(iso).split(", ");
  return el("span", { class: "when" }, d, el("small", { text: h || "" }));
}

function andamento(p) {
  const linha = (rotulo, iso) => el("div", { class: "when" }, rotulo + " ", iso ? fmtCurta(iso) : "—");
  return el("div", {}, linha("💰", p.pago_em), linha("📦", p.entregue_em));
}

function renderRows() {
  const lista = filtrados();
  const total = lista.reduce((s, p) => s + p.total, 0);
  const visiveis = lista.slice(0, estado.limite);
  $("count").textContent = `Mostrando ${visiveis.length} de ${lista.length} compra(s)` +
    (lista.length !== pedidos.length ? ` (filtradas de ${pedidos.length})` : "") + ` · soma ${brl(total)}`;
  const mais = $("mais");
  mais.hidden = lista.length <= visiveis.length;
  mais.textContent = `Mostrar mais ${Math.min(POR_PAGINA, lista.length - visiveis.length)} (faltam ${lista.length - visiveis.length})`;
  const tb = $("rows"); tb.replaceChildren();
  if (!lista.length) {
    const vazio = el("td", { class: "empty", colspan: String(COLUNAS.length), text: pedidos.length ? "Nenhuma compra com esses filtros." : "Nenhuma compra registrada ainda." });
    vazio.removeAttribute("data-label");
    tb.append(el("tr", {}, vazio)); return;
  }
  for (const p of visiveis) {
    const copiar = el("button", { type: "button", title: "Copiar ID", "aria-label": `Copiar ID ${p.usuario_id}`, text: "copiar" });
    copiar.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(p.usuario_id); copiar.textContent = "copiado"; setTimeout(() => (copiar.textContent = "copiar"), 1200); } catch { /* sem permissão de área de transferência */ }
    });
    const tr = el("tr", novos.has(p.id) ? { class: "novo" } : {},
      td("Compra", el("span", { class: "id", text: "#" + String(p.id).padStart(2, "0") })),
      td("Data", quando(p.criado_em)),
      td("Comprador", el("div", {}, el("div", { class: "name", text: p.nome }), el("div", { class: "user", text: p.usuario }))),
      td("ID do usuário", el("span", { class: "uid" }, p.usuario_id, copiar)),
      td("Itens", el("div", { class: "items", text: itensTexto(p) })),
      td("Total", el("strong", { text: brl(p.total) }), "num"),
      td("Status", el("span", { class: "badge b-" + p.status, text: STATUS[p.status] || p.status })),
      td("Pago · Entregue", andamento(p)),
      td("Responsável", el("span", { text: p.atualizado_por ? p.atualizado_por.replace(/\s*\(\d+\)\s*$/, "") : "—" })));
    tb.append(tr);
  }
  novos = new Set();
}

function renderTudo() { renderCards(); renderChart(); renderRows(); }
let _larguraGrafico = 0;
new ResizeObserver(() => {
  const w = Math.round($("chart").getBoundingClientRect().width);
  if (w && w !== _larguraGrafico && !$("app").hidden) { _larguraGrafico = w; renderChart(); }
}).observe($("chart"));

// ---------- CSV ----------
function exportarCsv() {
  const seguro = (v) => { const t = String(v ?? ""); return /^[=+\-@\t\r]/.test(t) ? "'" + t : t; };
  const cel = (v) => `"${seguro(v).replace(/"/g, '""')}"`;
  const linhas = [["ID da compra", "Data/hora (Brasília)", "Nome", "Usuário", "ID do usuário", "Itens", "Total (R$)", "Status", "Pago em", "Entregue em", "Fechado em", "Responsável"]];
  for (const p of [...filtrados()].sort((a, b) => a.id - b.id)) {
    const f = (i) => i ? new Date(i).toLocaleString("pt-BR", { timeZone: TZ }) : "";
    linhas.push([String(p.id).padStart(2, "0"), f(p.criado_em), p.nome, p.usuario, p.usuario_id, itensTexto(p),
      (p.total / 100).toFixed(2).replace(".", ","), STATUS[p.status] || p.status, f(p.pago_em), f(p.entregue_em), f(p.fechado_em), p.atualizado_por]);
  }
  const blob = new Blob(["﻿" + linhas.map((l) => l.map(cel).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = el("a", { href: URL.createObjectURL(blob), download: `compras_${diaChave(new Date())}.csv` });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- controles ----------
function ligarControles() {
  const sel = $("fStatus");
  sel.append(el("option", { value: "", text: "Todos os status" }));
  for (const [k, v] of Object.entries(STATUS)) sel.append(el("option", { value: k, text: v }));
  $("q").addEventListener("input", (e) => { estado.busca = e.target.value; estado.limite = POR_PAGINA; renderRows(); });
  $("mais").addEventListener("click", () => { estado.limite += POR_PAGINA; renderRows(); });
  sel.addEventListener("change", (e) => { estado.status = e.target.value; estado.limite = POR_PAGINA; renderRows(); });
  $("fPeriodo").addEventListener("change", (e) => { estado.periodo = Number(e.target.value); estado.limite = POR_PAGINA; renderRows(); });
  $("csv").addEventListener("click", exportarCsv);
  renderHead();
}

function receber(docs, mudancas) {
  if (!primeiraCarga) for (const m of mudancas) if (m.type === "added") novos.add(Number(m.doc.data().id ?? m.doc.id));
  pedidos = docs.map((d) => normaliza(d.id, d.data()));
  primeiraCarga = false;
  mostrarApp(); renderTudo();
  setLive("on", "Ao vivo · atualizado " + new Date().toLocaleTimeString("pt-BR", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit" }));
}

// ---------- modo demonstração (#demo): dados fictícios, sem login ----------
function demo() {
  const base = Date.now(), h = 36e5, iso = (t) => new Date(t).toISOString();
  const mk = (id, nome, usuario, uid, itens, total, status, ago, pagoDepois, entregueDepois, por) => ({
    id, nome, usuario, usuario_id: uid, itens_detalhe: itens.map(([n, q]) => ({ nome: n, qtd: q })), total_centavos: total, status,
    criado_em: iso(base - ago * h), pago_em: pagoDepois != null ? iso(base - (ago - pagoDepois) * h) : null,
    entregue_em: entregueDepois != null ? iso(base - (ago - entregueDepois) * h) : null, atualizado_por: por || null,

  const quantas = Number((location.hash.match(/^#demo=(\d+)/) || [])[1] || 0);
  const docs = quantas ? Array.from({ length: quantas }, (_, i) => {
    const n = i + 1, st = ["aguardando_pagamento", "paga", "entregue", "cancelada"][n % 4];
    return mk(n, `Jogador ${n}`, `jogador${n}#${String(n % 10000).padStart(4, "0")}`, String(1100000000000000000 + n),
      [["Escolhidos dos Mares", (n % 5) + 1], ["Super Tesouro", (n % 3) + 1]], 500 * ((n % 5) + 1) + 2000 * ((n % 3) + 1), st, n % 400,
      st === "paga" || st === "entregue" ? 0.5 : null, st === "entregue" ? 1 : null, st === "aguardando_pagamento" ? null : "Staff (1)");
  }).map((d) => ({ id: String(d.id).padStart(2, "0"), data: () => d })) : [
    mk(1, "Percy 🤡", "percy#0", "1100000000000000001", [["Escolhidos dos Mares", 2], ["Renascimento", 1]], 2500, "entregue", 130, 2, 5, "Ana (Moderação) (11)"),
    mk(2, "=SOMA(1+1)", "=hack#0", "1100000000000000002", [["Token de Segunda Chance", 3]], 1500, "cancelada", 100, null, null, "Ana (Moderação) (11)"),
    mk(3, "Zoro <img src=x onerror=alert(1)>", "zoro#1234", "1100000000000000003", [["Super Tesouro", 1], ["Caçador de Tesouros", 1], ["Rumores!", 2]], 4000, "paga", 52, 1, null, "Beto (Developer) (12)"),
    mk(4, "Nami", "nami#0420", "1100000000000000004", [["Manobra de Emergência", 1], ["Aviso de Amigo", 1]], 1000, "entregue", 30, 1, 3, "Beto (Developer) (12)"),
    mk(5, "Usopp", "usopp#7777", "1100000000000000005", [["Re-roll de Lunariano", 1]], 2000, "aguardando_pagamento", 5, null, null, null),
    mk(6, "Sanji", "sanji#1111", "1100000000000000006", [["Sorte Grande", 2], ["Mudança Pequena", 1]], 3500, "aguardando_pagamento", 1, null, null, null),
  ].map((d) => ({ id: String(d.id).padStart(2, "0"), data: () => d }));
  setLive("on", "Modo demonstração · dados fictícios");
  ligarControles(); receber(docs, []);

// ---------- Firebase ----------
async function iniciar() {
  if (/^#demo(=\d+)?$/.test(location.hash)) return demo();

  const { firebaseConfig } = await import("./firebase-config.js");
  if (Object.values(firebaseConfig).some((v) => String(v).includes("COLE_AQUI"))) {
    setLive("off", "Não configurado");
    return mostrarEstado("Falta configurar o Firebase", "Edite dashboard/firebase-config.js com os dados do app web do seu projeto. Para só ver como o painel fica, abra esta página com #demo no final do endereço.");
  }
  const V = "11.10.0", base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{ initializeApp }, A, F] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js"),
  ]);
  const app = initializeApp(firebaseConfig), auth = A.getAuth(app), db = F.getFirestore(app);
  ligarControles();
  let cancelarEscuta = null;

  const entrar = el("button", { class: "btn primary", type: "button", text: "Entrar com Google" });
  entrar.addEventListener("click", async () => {
    try { await A.signInWithPopup(auth, new A.GoogleAuthProvider()); }
    catch (e) {
      if (e.code === "auth/popup-blocked") return A.signInWithRedirect(auth, new A.GoogleAuthProvider());
      if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
      const dicas = {
        "auth/operation-not-allowed": "O login do Google ainda não foi ativado no Firebase (Authentication → Sign-in method → Google → Ativar).",
        "auth/configuration-not-found": "O Firebase Authentication ainda não foi iniciado (Authentication → Começar, depois ativar o Google).",
        "auth/unauthorized-domain": "Este endereço não está autorizado (Authentication → Settings → Authorized domains).",
      };
      mostrarEstado("Não consegui entrar", dicas[e.code] || `${e.code || e.message}`, entrar);
    }
  });
  $("signOut").addEventListener("click", () => A.signOut(auth));

  A.onAuthStateChanged(auth, (user) => {
    if (cancelarEscuta) { cancelarEscuta(); cancelarEscuta = null; }
    primeiraCarga = true; pedidos = [];
    $("who").hidden = $("signOut").hidden = !user;
    if (!user) {
      setLive("wait", "Aguardando login");
      return mostrarEstado("Acesso restrito", "Entre com a conta Google autorizada pela staff para ver as compras.", entrar);
    }
    $("who").textContent = user.email;
    setLive("wait", "Conectando…");
    mostrarEstado("Carregando compras…", "");
    cancelarEscuta = F.onSnapshot(F.collection(db, "loja_pedidos"),
      (snap) => receber(snap.docs, snap.docChanges()),
      (err) => {
        setLive("off", "Sem acesso");
        if (err.code === "permission-denied") {
          mostrarEstado("Sem permissão", `A conta ${user.email} não está autorizada. Peça à staff para rodar, no Discord: buggy!loja_acesso adicionar ${user.email}`);
        } else mostrarEstado("Erro ao carregar", `${err.code || ""} ${err.message || ""}`);
      });
  });
  window.addEventListener("offline", () => setLive("off", "Sem internet"));
  window.addEventListener("online", () => setLive("wait", "Reconectando…"));
}

iniciar().catch((e) => { setLive("off", "Erro"); mostrarEstado("Erro ao iniciar o painel", String(e.message || e)); });
</script>
