[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    integration: fala com o Firebase REAL (precisa de credenciais). Só roda com RUN_INTEGRATION=1.
    browser: abre o Chrome (precisa de Node e do Google Chrome). Pulado se não houver.
    carga: teste de pico de uso (mais demorado).
filterwarnings =
    ignore::DeprecationWarning
